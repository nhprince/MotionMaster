<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Motion Master — Advanced Motion Calculator</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <aside class="rail" id="rail">
      <div class="brand">
        <div class="brand-left">
          <div class="brand-mark" id="brandMark"></div>
          <div class="brand-text">
            <h1>Motion Master</h1>
            <p id="brandTagline">Advanced kinematics, solved.</p>
          </div>
        </div>
        <button class="collapse-btn" id="collapseBtn" title="Toggle sidebar" aria-label="Toggle sidebar"></button>
      </div>

      <nav class="topics" id="topicNav"></nav>

      <div class="rail-controls">
        <div class="mode-toggle" role="group" aria-label="Calculation mode">
          <button class="mode-btn active" data-mode="quick">
            <span class="mode-icon">⚡</span><span class="mode-label">Quick</span>
          </button>
          <button class="mode-btn" data-mode="learn">
            <span class="mode-icon">◎</span><span class="mode-label">Learn</span>
          </button>
        </div>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button class="lang-btn active" data-lang="en">EN</button>
          <button class="lang-btn" data-lang="bn">বাং</button>
        </div>
      </div>
      <p class="mode-hint" id="modeHint">Quick gives you the number. Learn shows the working, the graph, and the motion itself.</p>
    </aside>

    <main class="workspace">
      <div class="workspace-inner">
        <header class="module-header">
          <h2 id="moduleTitle">—</h2>
          <p id="moduleDesc">—</p>
        </header>

        <section class="panel">
          <div class="extra-toggle" id="extraToggleWrap" hidden></div>
          <div class="field-grid" id="fieldGrid"></div>
          <div class="solve-row">
            <div class="solve-select">
              <label id="solveLabel">Solve for</label>
              <div class="dropdown" id="solveDropdown"></div>
            </div>
            <button id="calcBtn">Calculate</button>
          </div>
        </section>

        <section class="panel results-panel" id="resultsPanel" hidden>
          <div id="readout"></div>
          <div class="learn-extra" id="learnExtra" hidden>
            <div id="steps" class="steps"></div>
            <div id="visual" class="visual"></div>
          </div>
        </section>
      </div>
    </main>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
